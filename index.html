<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Measurement App</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="mm-app">

<!-- JOBS -->
<div class="screen active" id="screen-jobs">
  <div class="topbar">
    <h1>Jobs</h1>
    <div class="font-controls">
      <button class="font-btn" id="mm-theme-toggle" aria-label="Switch to light mode">☀️</button>
      <button class="font-btn" id="mm-font-down" aria-label="Decrease text size">A-</button>
      <button class="font-btn" id="mm-font-up" aria-label="Increase text size">A+</button>
    </div>
  </div>
  <div class="mm-content">
    <div class="mm-search-bar">
      <span class="mm-search-icon" aria-hidden="true">&#128269;</span>
      <label for="mm-job-search" class="sr-only">Search jobs by name or address</label>
      <input class="mm-input" id="mm-job-search" placeholder="Search by name or address...">
    </div>
    <div id="mm-jobs-list"><div class="mm-empty">Loading jobs...</div></div>
  </div>
</div>

<!-- JOB DETAIL -->
<div class="screen" id="screen-job">
  <div class="topbar">
    <button class="back-btn" id="mm-back-to-jobs" aria-label="Back to jobs">&#8249;</button>
    <h1 id="mm-job-title">Job</h1>
  </div>
  <div class="mm-content">
    <div class="card" id="mm-job-info"></div>
    <div class="mm-divider"></div>
    <div class="section-header"><span class="section-title">Rooms</span><button class="mm-btn-sm mm-btn-primary" id="mm-add-room-btn">+ Add Room</button></div>
    <div id="mm-rooms-list"></div>
    <div class="mm-divider"></div>
    <div class="section-header"><span class="section-title">Photos &amp; Videos</span></div>
    <div id="mm-job-media"></div>
  </div>
</div>

<!-- ROOM — everything inside is accordions -->
<div class="screen" id="screen-room">
  <button class="float-save" id="mm-float-save" style="display:none">Save</button>
  <div class="topbar">
    <button class="back-btn" id="mm-back-to-job" aria-label="Back to job">&#8249;</button>
    <h1 id="mm-room-title">Room</h1>
  </div>
  <div class="mm-content">
    <div class="card" id="mm-room-info"></div>
    <div class="mm-divider"></div>
    <div class="section-header"><span class="section-title">Walls</span><button class="mm-btn-sm mm-btn-primary" id="mm-add-wall-btn">+ Add Wall</button></div>
    <div id="mm-walls-list"></div>
    <div class="mm-divider"></div>
    <div class="section-header"><span class="section-title">Islands</span><button class="mm-btn-sm mm-btn-primary" id="mm-add-island-btn">+ Add Island</button></div>
    <div id="mm-islands-list"></div>
    <div class="mm-divider"></div>
    <div class="section-header"><span class="section-title">Lighting</span><button class="mm-btn-sm mm-btn-primary" id="mm-add-light-btn">+ Add</button></div>
    <div id="mm-lights-list"></div>
    <div class="mm-divider"></div>
    <div class="section-header"><span class="section-title">Photos &amp; Videos</span></div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="mm-btn-sm mm-btn-primary" id="mm-photo-camera">📷 Camera</button>
      <button class="mm-btn-sm mm-btn-primary" id="mm-photo-upload">📁 Upload</button>
    </div>
    <div id="mm-media-gallery"></div>
    <input type="file" id="mm-file-input" accept="image/*,video/*" style="display:none">
  </div>
</div>

<!-- Room modal -->
<div class="mm-modal-overlay" id="mm-modal-room">
  <div class="mm-modal" role="dialog" aria-modal="true" aria-labelledby="mm-room-modal-title">
    <div class="mm-modal-title" id="mm-room-modal-title">Add Room</div>
    <div class="mm-field-group"><label class="mm-label" for="mm-rm-name">Room Name *</label><input class="mm-input" id="mm-rm-name" placeholder="e.g. Kitchen"></div>
    <div class="mm-field-group"><label class="mm-label" for="mm-rm-ceiling">Ceiling Height (inches)</label><input class="mm-input" type="number" id="mm-rm-ceiling" placeholder="e.g. 96"></div>
    <div class="mm-field-group"><label class="mm-label" for="mm-rm-floor">Flooring Type</label><input class="mm-input" id="mm-rm-floor" placeholder="e.g. Tile, Hardwood"></div>
    <div class="mm-field-group"><label class="mm-label" for="mm-rm-notes">Notes</label><textarea class="mm-input" id="mm-rm-notes"></textarea></div>
    <button class="mm-btn mm-btn-primary" id="mm-save-room-btn">Save Room</button>
    <button class="mm-btn mm-btn-secondary" id="mm-cancel-room-btn">Cancel</button>
  </div>
</div>

</div><!-- #mm-app -->

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/media.js"></script>
<script src="js/entities.js"></script>
<script src="js/walls.js"></script>
<script src="js/lighting.js"></script>
<script src="js/app.js"></script>
</body>
</html>
